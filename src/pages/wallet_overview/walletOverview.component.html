<div class="wallet">
  <h1 class="wallet__title">Billetera</h1>

  @if (useLibrary()) {
    <vixo-balance-ui [total]="wallet.balance()"></vixo-balance-ui>
  } @else {
    <!-- Fallback while the component library loads or when it is unavailable -->
    <app-balance [total]="wallet.balance()"></app-balance>
  }

  <div class="wallet__header">
    <h2 class="wallet__subtitle">Movimientos</h2>
    <button mat-flat-button type="button" (click)="openAddDialog()">
      <mat-icon>add</mat-icon>
      Agregar movimiento
    </button>
  </div>

  @if (wallet.transactions().length === 0) {
    <p class="wallet__empty">Todavía no hay movimientos.</p>
  } @else {
    <ul class="wallet__list">
      @for (tx of wallet.transactions(); track tx.id) {
        <li>
          @if (useLibrary()) {
            <vixo-transaction-item-ui
              [type]="tx.type"
              [logoUrl]="tx.logoUrl ?? ''"
              [motivo]="tx.description"
              [subtitulo]="tx.detail"
              [etiqueta]="tx.category"
              [precio]="tx.amount"
            ></vixo-transaction-item-ui>
          } @else {
            <app-transaction-item [transaction]="tx"></app-transaction-item>
          }
        </li>
      }
    </ul>
  }
</div>
