<div class="wallet">
  <h1 class="wallet__title">Billetera</h1>

  @if (useLibrary()) {
    <vixo-balance [total]="wallet.balance()"></vixo-balance>
  } @else {
    <!-- Fallback while the component library loads or when it is unavailable -->
    <app-balance [total]="wallet.balance()"></app-balance>
  }

  <div class="wallet__header">
    <h2 class="wallet__subtitle">Movimientos</h2>
    <div class="wallet__actions">
      <a
        mat-stroked-button
        [routerLink]="['catalog', 'category']"
        class="wallet__catalog-link"
      >
        <mat-icon>category</mat-icon>
        Crear categoría
      </a>
      <a
        mat-stroked-button
        [routerLink]="['catalog', 'label']"
        class="wallet__catalog-link"
      >
        <mat-icon>new_label</mat-icon>
        Crear etiqueta
      </a>
      <button mat-flat-button type="button" (click)="openAddDialog()">
        <mat-icon>add</mat-icon>
        Agregar movimiento
      </button>
    </div>
  </div>

  @if (wallet.transactions().length === 0) {
    <p class="wallet__empty">Todavía no hay movimientos.</p>
  } @else {
    <ul class="wallet__list">
      @for (tx of wallet.transactions(); track tx.id) {
        <li>
          @if (useLibrary()) {
            <vixo-transaction-item
              [type]="tx.type"
              [logoUrl]="tx.logoUrl ?? ''"
              [motivo]="tx.motivo"
              [subtitulo]="tx.detail"
              [etiqueta]="tx.category"
              [precio]="tx.amount"
            ></vixo-transaction-item>
          } @else {
            <app-transaction-item [transaction]="tx"></app-transaction-item>
          }
        </li>
      }
    </ul>
  }
</div>
