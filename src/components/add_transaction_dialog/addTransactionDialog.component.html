<h2 mat-dialog-title>Agregar movimiento</h2>
<form novalidate (submit)="save($event)">
  <mat-dialog-content class="add-transaction">
    <mat-radio-group
      class="add-transaction__type"
      aria-label="Tipo de movimiento"
      [value]="type()"
      (change)="type.set($event.value)"
    >
      <mat-radio-button value="expense">Gasto</mat-radio-button>
      <mat-radio-button value="income">Ingreso</mat-radio-button>
    </mat-radio-group>

    <mat-form-field appearance="outline">
      <mat-label>Descripción</mat-label>
      <input matInput name="description" [value]="description()" (input)="description.set(valueOf($event))" />
    </mat-form-field>
    @if (descriptionError()) {
      <p class="add-transaction__error" role="alert">{{ descriptionError() }}</p>
    }

    <mat-form-field appearance="outline">
      <mat-label>Detalle</mat-label>
      <input matInput name="detail" [value]="detail()" (input)="detail.set(valueOf($event))" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Categoría</mat-label>
      <input matInput name="category" [value]="category()" (input)="category.set(valueOf($event))" />
    </mat-form-field>

    <mat-form-field appearance="outline" floatLabel="always">
      <mat-label>Monto</mat-label>
      <span matTextPrefix>$&nbsp;</span>
      <input
        matInput
        name="amount"
        type="number"
        min="0"
        step="0.01"
        placeholder="0.00"
        [value]="amount()"
        (input)="amount.set(valueOf($event))"
      />
    </mat-form-field>
    @if (amountError()) {
      <p class="add-transaction__error" role="alert">{{ amountError() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancelar</button>
    <button mat-flat-button type="submit">Agregar</button>
  </mat-dialog-actions>
</form>
